# Lamma: step 1 only. Serves plain HTTP on port 80 so certbot can prove you own the domain and get the first certificate.
# Once the certificate exists, replace this file with deploy/nginx/lamma.conf (see docs/deployment.md, "HTTPS").
# Replace lamma.example with your domain.

server {
    listen 80;
    listen [::]:80;
    server_name lamma.example www.lamma.example;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        default_type text/plain;
        return 200 "Lamma is being set up.\n";
    }
}
