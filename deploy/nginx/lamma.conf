# Lamma on one server: HTTPS, PHP-FPM, and the Reverb WebSocket proxy.
# Install:  sudo cp deploy/nginx/lamma.conf /etc/nginx/sites-available/lamma.conf
#           sudo ln -s /etc/nginx/sites-available/lamma.conf /etc/nginx/sites-enabled/lamma.conf
#           sudo nginx -t && sudo systemctl reload nginx
# Replace lamma.example with your domain, and /var/www/lamma with the app folder, everywhere in this file.

# Reverb (WebSocket) needs "Connection: upgrade" only while the browser asks for an upgrade.
map $http_upgrade $lamma_connection_upgrade {
    default upgrade;
    ''      close;
}

# Plain HTTP: certbot's challenge, then everything to https.
server {
    listen 80;
    listen [::]:80;
    server_name lamma.example www.lamma.example;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://lamma.example$request_uri;
    }
}

# www goes to the bare domain.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.lamma.example;

    ssl_certificate     /etc/letsencrypt/live/lamma.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lamma.example/privkey.pem;

    return 301 https://lamma.example$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lamma.example;

    root /var/www/lamma/public;
    index index.php;
    charset utf-8;

    # Certificates from certbot (docs/deployment.md, "HTTPS").
    ssl_certificate     /etc/letsencrypt/live/lamma.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lamma.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:lamma_ssl:10m;
    ssl_session_timeout 1d;

    # Question images are uploaded in the admin panel.
    client_max_body_size 8M;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Text assets travel compressed (images, fonts and sounds already are).
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    # Built assets have a hash in their name: cache them for a year. (add_header inside a location replaces the ones above, so they are repeated.)
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # Logo, icons and sounds keep their names when the official files replace the placeholders: 30 days, not forever.
    location ^~ /brand/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    location ^~ /sounds/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # Reverb: browsers connect to wss://lamma.example/app/<key>; the server's own API is /apps/<id>/events. Both go to Reverb on this machine.
    location /app {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $lamma_connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:8080;
    }

    location /apps {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $lamma_connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Only index.php runs PHP; any other .php in public/ is a 404, never executed.
    location = /index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm-lamma.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ {
        return 404;
    }

    # .env, .git and friends are not in public/, but never serve a dotfile anyway (certbot's /.well-known is fine).
    location ~ /\.(?!well-known) {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    access_log /var/log/nginx/lamma.access.log;
    error_log  /var/log/nginx/lamma.error.log warn;
}
