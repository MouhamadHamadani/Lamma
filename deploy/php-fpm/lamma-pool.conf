; A PHP-FPM pool just for Lamma, run by the same Unix user that owns the code and deploys it (user "lamma"), so the web app, the queue
; worker, Reverb, the scheduler and deploy.sh all create files with the same owner and nothing is ever "permission denied".
; Install:  sudo cp deploy/php-fpm/lamma-pool.conf /etc/php/8.3/fpm/pool.d/lamma.conf
;           sudo systemctl restart php8.3-fpm        (and you may delete the default pool.d/www.conf)

[lamma]
user = lamma
group = lamma

listen = /run/php/php8.3-fpm-lamma.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Errors go to the app's log through Laravel; PHP itself only says what it must.
php_admin_value[error_log] = /var/log/php8.3-fpm-lamma.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 8M
php_admin_value[post_max_size] = 10M
