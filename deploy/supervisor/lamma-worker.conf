; The queue worker (game timers, queued mail). Install:
;   sudo cp deploy/supervisor/lamma-worker.conf /etc/supervisor/conf.d/lamma-worker.conf
;   sudo supervisorctl reread && sudo supervisorctl update
; deploy.sh runs "php artisan queue:restart", which makes each worker finish its job and exit; Supervisor starts a fresh one.
; --max-time=3600 does the same every hour, so memory never grows for long.

[program:lamma-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/lamma/artisan queue:work redis --sleep=1 --tries=3 --max-time=3600
directory=/var/www/lamma
user=lamma
numprocs=2
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/lamma/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
