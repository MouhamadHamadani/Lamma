; The Reverb WebSocket server. It listens on this machine only; nginx exposes it as wss://<domain>/app. Install:
;   sudo cp deploy/supervisor/lamma-reverb.conf /etc/supervisor/conf.d/lamma-reverb.conf
;   sudo supervisorctl reread && sudo supervisorctl update
; Many phones means many open connections: raise the limit with "minfds=10000" in the [supervisord] section of
; /etc/supervisor/supervisord.conf (docs/deployment.md), then restart supervisor.
; deploy.sh runs "php artisan reverb:restart", which makes Reverb exit cleanly; Supervisor starts it again with the new code.

[program:lamma-reverb]
command=/usr/bin/php /var/www/lamma/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/var/www/lamma
user=lamma
numprocs=1
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/var/www/lamma/storage/logs/reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
