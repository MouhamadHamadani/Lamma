name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# The jobs need no database server: the app runs on a SQLite file here, and the test suite on SQLite in memory.
env:
  DB_CONNECTION: sqlite
  DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
  CACHE_STORE: array
  SESSION_DRIVER: array
  QUEUE_CONNECTION: sync

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, bcmath, gd, zip, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Create the SQLite database
        run: touch database/database.sqlite

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

  # Real-browser smoke tests (Pest + Playwright). A separate job, so the fast checks above do not wait for them.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, bcmath, gd, zip, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Create the SQLite database
        run: touch database/database.sqlite

      - name: Setup Application
        run: composer setup

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: vendor/bin/pest tests/Browser

      - name: Keep the screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-screenshots
          path: tests/Browser/Screenshots
          if-no-files-found: ignore
          retention-days: 7
