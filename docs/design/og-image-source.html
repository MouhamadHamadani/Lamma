<!doctype html>
<!--
  The source of public/brand/og-image.png (1200x630): the picture a link to Lamma shows in WhatsApp, X, Facebook and Telegram (og:image / twitter:image,
  see resources/views/partials/head.blade.php). It is a PLACEHOLDER built from our own placeholder logo, the brand colours and Baloo Bhaijaan 2, because no official brand sheet
  has been supplied. When the official sheet or logo kit arrives, replace public/brand/og-image.png with a 1200x630 PNG under the same name (and delete its line from `placeholders`
  in config/lamma.php so `php artisan lamma:doctor` stops warning).

  To regenerate it from this file: serve the site (the page loads /build/assets and /brand from it), copy this file to public/_og.html, open http://localhost:<port>/_og.html in a
  1200x630 viewport and screenshot it, then delete public/_og.html. The colours are the tokens of resources/css/lamma-theme.css, written out because this is an image, not a screen.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lamma · og-image</title>
  <link rel="stylesheet" href="/build/assets/fonts-ZgGVhpBJ.css">
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #1B1F4B; }
    body { position: relative; font-family: 'Baloo Bhaijaan 2', system-ui, sans-serif; color: #FFF7EC; }
    .logo { position: absolute; left: 96px; top: 132px; width: 366px; height: 366px; display: flex; align-items: center; justify-content: center; }
    .logo img { width: 366px; height: auto; }
    .text { position: absolute; left: 548px; top: 128px; width: 560px; display: flex; flex-direction: column; gap: 8px; }
    .en { font-size: 76px; font-weight: 800; line-height: 1.02; letter-spacing: -1px; }
    .ar { font-size: 76px; font-weight: 800; line-height: 1.3; color: #FF5A5F; direction: rtl; text-align: left; }
    .sub { margin-top: 18px; font-size: 30px; font-weight: 600; color: #D5D7EA; line-height: 1.3; }
    .url { position: absolute; left: 548px; bottom: 58px; font-size: 38px; font-weight: 800; color: #FFC23C; letter-spacing: .5px; }
    .shape { position: absolute; }
    .tri { width: 0; height: 0; border-left: 28px solid transparent; border-right: 28px solid transparent; border-bottom: 50px solid #FF5A5F; }
    .circle { border-radius: 50%; background: #2EC4B6; }
    .square { background: #FFC23C; }
    .diamond { background: #FF5A5F; transform: rotate(45deg); }
    .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 18px; display: flex; }
    .bar i { flex: 1; display: block; }
  </style>
</head>
<body>
  <div class="shape tri" style="left: 64px; top: 70px; transform: rotate(-14deg)"></div>

  <div class="logo"><img src="/brand/lamma-logo-stacked-dark.svg" alt=""></div>

  </div>
  <div class="url">lamma.build-syntax.com</div>
  <div class="bar"><i style="background:#FF5A5F"></i><i style="background:#2EC4B6"></i><i style="background:#FFC23C"></i><i style="background:#FF5A5F"></i></div>
